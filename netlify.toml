# Netlify build settings for the static Astro site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the local toolchain (package.json engines: node >=22.12.0).
  NODE_VERSION = "22"

# Security headers. Static Astro build with no inline styles; only external
# resources are Google Fonts and Netlify-injected Google Analytics (gtag).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self' 'sha256-IkGUMq2EozdnOzsS4p30WUBg6dP4XceDskgkPOznY5Q=' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
